<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>주문 완료 · LUIOFFICE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
<main>
  <section class="wrap" style="padding:90px 28px;text-align:center" id="cpRoot"></section>
</main>

<script src="/assets/js/products.js"></script>
<script src="/assets/js/app.js"></script>
<script>
document.addEventListener('luio:ready', async ()=>{
  const no = new URLSearchParams(location.search).get('no');
  const root = document.getElementById('cpRoot');
  let order;
  try{ order = (await window.LUIO.api('/orders/'+no)).order; }catch(e){}
  if(!order){ root.innerHTML='<p>주문 정보를 찾을 수 없습니다.</p><a class="btn green" href="/" style="margin-top:20px">홈으로</a>'; return; }
  root.innerHTML = `
    <div style="font-size:3rem;color:var(--green)">✓</div>
    <span class="eyebrow" style="margin-top:10px;display:block">Order Received</span>
    <h1 class="serif" style="font-size:clamp(2rem,5vw,3rem);font-weight:600;margin:12px 0">주문이 접수되었습니다</h1>
    <p class="muted" style="max-width:46ch;margin:0 auto 8px">${order.buyer_name}님, 감사합니다. 담당 컨시어지가 확인 후 결제 및 배송 안내를 드립니다.</p>
    <p style="font-family:var(--serif);font-size:1.3rem;margin:18px 0">주문번호 <b style="color:var(--green)">${order.order_no}</b></p>
    <div style="max-width:460px;margin:26px auto 0;text-align:left;border:1px solid var(--line);border-radius:6px;padding:24px;background:var(--paper)">
      ${order.items.map(i=>`<div style="display:flex;justify-content:space-between;padding:6px 0;font-size:.9rem"><span>${i.brand} ${i.name} ×${i.qty}</span><span>${won(i.price*i.qty)}</span></div>`).join('')}
      <div style="display:flex;justify-content:space-between;border-top:1px solid var(--line);margin-top:10px;padding-top:12px;font-family:var(--serif);font-size:1.2rem"><span>합계</span><b>${won(order.total)}</b></div>
    </div>
    <div style="margin-top:26px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap">
      <a class="btn green" href="/account?tab=orders">주문 내역 보기</a>
      <a class="btn ghost" href="/shop">쇼핑 계속하기</a>
    </div>`;
});
</script>
</body>
</html>
