<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>주문서 · LUIOFFICE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
<main>
  <div class="page-hero"><div class="wrap"><div class="crumb">HOME / CHECKOUT</div><h1>주문서</h1></div></div>
  <section class="wrap" id="coRoot"></section>
</main>

<script src="/assets/js/products.js"></script>
<script src="/assets/js/app.js"></script>
<script>
document.addEventListener('luio:ready', async ()=>{
  const root = document.getElementById('coRoot');
  const d = await window.LUIO.api('/cart');
  const user = window.LUIO.currentUser();

  if(!d.items.length){
    root.innerHTML = `<div class="empty-state"><p>주문할 상품이 없습니다.</p><a class="btn green" href="/shop" style="margin-top:20px">쇼핑하러 가기</a></div>`;
    return;
  }

  root.innerHTML = `
  <form class="checkout" id="coForm" novalidate>
    <div>
      ${!user ? `<div class="co-section" style="border-color:var(--gold);background:#fbf6ec">
        <h3>비회원 주문</h3>
        <p class="muted" style="margin-bottom:14px">로그인하면 주문 내역을 마이 부티크에서 관리할 수 있습니다.</p>
        <button type="button" class="btn green sm" onclick="window.LUIO.openAuth('login')">로그인 / 회원가입</button>
      </div>`:''}
      <div class="co-section">
        <h3>주문자 정보</h3>
        <div class="co-grid">
          <div class="field"><label>이름</label><input name="name" value="${user?user.name:''}" required><div class="err">이름을 입력해 주세요.</div></div>
          <div class="field"><label>연락처</label><input name="phone" placeholder="010-0000-0000" required><div class="err">연락처를 입력해 주세요.</div></div>
          <div class="field full"><label>이메일</label><input name="email" type="email" value="${user?user.email:''}" required><div class="err">이메일을 확인해 주세요.</div></div>
        </div>
      </div>
      <div class="co-section">
        <h3>배송지</h3>
        <div class="co-grid">
          <div class="field full"><label>주소</label><input name="addr" placeholder="도로명 주소" required><div class="err">주소를 입력해 주세요.</div></div>
          <div class="field full"><label>상세 주소</label><input name="addr2" placeholder="상세 주소 (동/호수)"></div>
          <div class="field full"><label>배송 메모</label><textarea name="memo" rows="2" placeholder="예: 부재 시 경비실에 맡겨주세요"></textarea></div>
        </div>
      </div>
      <div class="co-section">
        <h3>결제 수단</h3>
        <div class="pay-disabled">💳 현재 안전결제 시스템 점검 중입니다.<br>주문 접수 후 담당 컨시어지가 결제 및 배송 안내를 개별 연락드립니다.</div>
      </div>
    </div>

    <div>
      <div class="summary">
        <h3>주문 상품</h3>
        <div id="coItems" style="margin-bottom:14px"></div>
        <div class="row"><span>상품 합계</span><span>${won(d.subtotal)}</span></div>
        <div class="row"><span>배송비</span><span>${d.shipping? won(d.shipping):'무료'}</span></div>
        <div class="row total"><span>총 결제 예정</span><b>${won(d.total)}</b></div>
        <button class="btn green block" type="submit" style="margin-top:18px">주문 접수하기</button>
        <p class="note">주문 확인 후 결제 안내를 순차적으로 연락드립니다.</p>
      </div>
    </div>
  </form>`;

  document.getElementById('coItems').innerHTML = d.items.map(p=>
    `<div style="display:flex;justify-content:space-between;font-size:.86rem;padding:5px 0;color:var(--ink-soft)">
      <span>${p.brand} ${p.name} <b style="color:var(--stone)">×${p.qty}</b></span><span>${won(p.lineTotal)}</span></div>`).join('');

  document.getElementById('coForm').addEventListener('submit', async e=>{
    e.preventDefault();
    const f = e.target; let ok = true;
    ['name','phone','email','addr'].forEach(n=>{
      const inp = f[n]; const bad = !inp.value.trim() || (n==='email' && !/^\S+@\S+\.\S+$/.test(inp.value));
      inp.closest('.field').classList.toggle('invalid', bad); if(bad) ok=false;
    });
    if(!ok) return;
    const btn = f.querySelector('button[type=submit]'); btn.disabled = true; btn.textContent = '접수 중…';
    try{
      const {orderNo} = await window.LUIO.api('/orders',{method:'POST',body:{
        name:f.name.value, phone:f.phone.value, email:f.email.value,
        address:(f.addr.value + ' ' + f.addr2.value).trim(), memo:f.memo.value
      }});
      await window.LUIO.refreshCart();
      location.href = '/complete?no=' + orderNo;
    }catch(err){ btn.disabled=false; btn.textContent='주문 접수하기'; window.LUIO.toast(err.message); }
  });
});
</script>
</body>
</html>
