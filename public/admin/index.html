<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>주문 관리 · LUIOFFICE Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
<div class="admin-bar">
  <div class="wrap">
    <div class="a-brand">LUIOFFICE<span>ADMIN · 주문관리</span></div>
    <div style="display:flex;gap:18px;align-items:center">
      <a href="/">← 스토어로</a>
      <a href="#" id="adminLogout">로그아웃</a>
    </div>
  </div>
</div>

<div id="adminRoot"><div class="admin-wrap"><p class="muted">불러오는 중…</p></div></div>

<script>
/* ---------- 간단 API 헬퍼 (admin 전용) ---------- */
async function api(path, opts={}){
  const res = await fetch('/api'+path, {
    method:opts.method||'GET',
    headers:opts.body?{'Content-Type':'application/json'}:{},
    body:opts.body?JSON.stringify(opts.body):undefined,
    credentials:'same-origin'
  });
  let data=null; try{ data=await res.json(); }catch(e){}
  if(!res.ok) throw Object.assign(new Error((data&&data.error)||'error'),{status:res.status});
  return data;
}
const won = n => '₩'+Number(n).toLocaleString('ko-KR');
const root = document.getElementById('adminRoot');
let state = { status:'all', q:'' };

async function boot(){
  // 관리자 확인
  let me;
  try{ me = (await api('/auth/me')).user; }catch(e){}
  if(!me || me.role!=='admin'){ return renderGate(!!me); }
  render();
}

function renderGate(loggedInButNotAdmin){
  root.innerHTML = `<div class="admin-wrap"><div class="admin-gate">
    <h2 style="font-family:var(--serif);font-size:1.8rem;color:var(--green)">관리자 로그인</h2>
    <p class="muted" style="margin:10px 0 22px">${loggedInButNotAdmin?'관리자 권한이 없는 계정입니다.':'주문 관리는 관리자만 접근할 수 있습니다.'}</p>
    <form id="adminLogin" style="text-align:left">
      <div class="field"><label>이메일</label><input name="email" type="email" value="admin@luioffice.co.kr" required></div>
      <div class="field"><label>비밀번호</label><input name="pw" type="password" value="admin1234" required><div class="err" style="display:none;color:#b5473f;font-size:.8rem;margin-top:6px" id="alErr"></div></div>
      <button class="btn green block" type="submit">로그인</button>
    </form>
    <p class="muted" style="font-size:.78rem;margin-top:16px">데모 관리자 · admin@luioffice.co.kr / admin1234</p>
  </div></div>`;
  document.getElementById('adminLogin').addEventListener('submit', async e=>{
    e.preventDefault();
    const f=e.target;
    try{ await api('/auth/login',{method:'POST',body:{email:f.email.value,password:f.pw.value}}); boot(); }
    catch(err){ const el=document.getElementById('alErr'); el.style.display='block'; el.textContent=err.message; }
  });
}

async function render(){
  const [stats, ordersRes] = await Promise.all([ api('/admin/stats'), loadOrders() ]);
  const orders = ordersRes.orders;
  const STAT = ordersRes.statuses;

  root.innerHTML = `<div class="admin-wrap">
    <div class="admin-stats">
      <div class="admin-stat"><span>총 주문</span><b>${stats.totalOrders}</b></div>
      <div class="admin-stat accent"><span>매출 (취소·대기 제외)</span><b>${won(stats.revenue)}</b></div>
      <div class="admin-stat warn"><span>결제 대기</span><b>${stats.pending}건</b></div>
      <div class="admin-stat"><span>회원 수</span><b>${stats.customers}명</b></div>
    </div>

    <div class="status-chips" id="chips">
      <button data-s="all" class="${state.status==='all'?'active':''}">전체<span class="c">${stats.totalOrders}</span></button>
      ${STAT.map(s=>`<button data-s="${s}" class="${state.status===s?'active':''}">${s}<span class="c">${stats.byStatus[s]||0}</span></button>`).join('')}
    </div>

    <div class="admin-tools">
      <input id="aq" placeholder="주문번호 · 이름 · 이메일 · 연락처 검색" value="${state.q}">
    </div>

    <table class="otable">
      <thead><tr><th>주문번호</th><th>주문자</th><th>상품</th><th>금액</th><th>일시</th><th>상태 / 관리</th></tr></thead>
      <tbody id="obody">${rows(orders, STAT)}</tbody>
    </table>
    ${orders.length?'':'<p class="muted" style="text-align:center;padding:40px 0">조건에 맞는 주문이 없습니다.</p>'}
  </div>`;

  document.getElementById('chips').querySelectorAll('button').forEach(b=>b.onclick=()=>{ state.status=b.dataset.s; render(); });
  const aq=document.getElementById('aq');
  aq.oninput = debounce(()=>{ state.q=aq.value.trim(); refreshBody(STAT); }, 300);
  aq.focus(); aq.setSelectionRange(aq.value.length, aq.value.length);
  bindRows(STAT);
}

function rows(orders, STAT){
  return orders.map(o=>`
    <tr data-row="${o.order_no}">
      <td class="ono">${o.order_no}</td>
      <td class="obuyer"><b>${o.buyer_name}</b><span>${o.buyer_phone}</span><span>${o.buyer_email}</span></td>
      <td class="oitems">${o.items.map(i=>`${i.brand} ${i.name} ×${i.qty}`).join('<br>')}<br><span style="color:var(--stone)">${o.address}</span></td>
      <td class="oprice">${won(o.total)}</td>
      <td style="white-space:nowrap;color:var(--stone)">${new Date(o.created_at).toLocaleString('ko-KR',{dateStyle:'short',timeStyle:'short'})}</td>
      <td>
        <span class="badge ${o.status}" data-badge>${o.status}</span>
        <div style="margin-top:8px">
          <select data-status="${o.order_no}">${STAT.map(s=>`<option ${s===o.status?'selected':''}>${s}</option>`).join('')}</select>
        </div>
        <button class="odel" data-del="${o.order_no}">주문 삭제</button>
      </td>
    </tr>`).join('');
}

async function loadOrders(){
  const query = new URLSearchParams();
  if(state.status!=='all') query.set('status', state.status);
  if(state.q) query.set('q', state.q);
  return api('/admin/orders?'+query.toString());
}

async function refreshBody(STAT){
  const res = await loadOrders();
  document.getElementById('obody').innerHTML = rows(res.orders, STAT);
  bindRows(STAT);
}

function bindRows(STAT){
  document.querySelectorAll('[data-status]').forEach(sel=>sel.onchange=async()=>{
    const no=sel.dataset.status;
    try{
      await api('/admin/orders/'+no,{method:'PATCH',body:{status:sel.value}});
      const badge=document.querySelector(`[data-row="${no}"] [data-badge]`);
      badge.className='badge '+sel.value; badge.textContent=sel.value;
      toast('상태가 변경되었습니다: '+sel.value);
    }catch(e){ toast(e.message); }
  });
  document.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{
    if(!confirm('이 주문을 삭제할까요? (되돌릴 수 없습니다)')) return;
    await api('/admin/orders/'+b.dataset.del,{method:'DELETE'});
    render();
  });
}

function debounce(fn,ms){ let t; return (...a)=>{ clearTimeout(t); t=setTimeout(()=>fn(...a),ms); }; }
function toast(msg){
  let t=document.getElementById('atoast');
  if(!t){ t=document.createElement('div'); t.id='atoast'; t.className='toast'; document.body.appendChild(t); }
  t.textContent=msg; t.classList.add('show'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),2000);
}

document.getElementById('adminLogout').addEventListener('click', async e=>{
  e.preventDefault();
  await api('/auth/logout',{method:'POST'});
  location.reload();
});

boot();
</script>
</body>
</html>
