<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>주문서 · LUIOFFICE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<main>
  <div class="page-hero"><div class="wrap"><div class="crumb">HOME / CHECKOUT</div><h1>주문서</h1></div></div>
  <section class="wrap" id="coRoot"></section>
</main>

<script src="assets/js/products.js"></script>
<script src="assets/js/app.js"></script>
<script>
document.addEventListener('DOMContentLoaded', ()=>{
  const root = document.getElementById('coRoot');
  const items = window.LUIO.Cart.all();
  const user = window.LUIO.Auth.current();

  if(!items.length){
    root.innerHTML = `<div class="empty-state"><p>주문할 상품이 없습니다.</p><a class="btn green" href="shop.html" style="margin-top:20px">쇼핑하러 가기</a></div>`;
    return;
  }

  const total = window.LUIO.Cart.total();
  const ship = total>=5000000 ? 0 : 50000;

  root.innerHTML = `
  <form class="checkout" id="coForm" novalidate>
    <div>
      ${!user ? `<div class="co-section" style="border-color:var(--gold);background:#fbf6ec">
        <h3>로그인이 필요합니다</h3>
        <p class="muted" style="margin-bottom:14px">주문을 진행하려면 회원 로그인이 필요합니다.</p>
        <button type="button" class="btn green sm" onclick="window.LUIO.openAuth('login')">로그인 / 회원가입</button>
      </div>`:''}
      <div class="co-section">
        <h3>주문자 정보</h3>
        <div class="co-grid">
          <div class="field"><label>이름</label><input name="name" value="${user?user.name:''}" required><div class="err">이름을 입력해 주세요.</div></div>
          <div class="field"><label>연락처</label><input name="phone" placeholder="010-0000-0000" required><div class="err">연락처를 입력해 주세요.</div></div>
          <div class="field full"><label>이메일</label><input name="email" type="email" value="${user?user.email:''}" required><div class="err">이메일을 확인해 주세요.</div></div>
        </div>
      </div>
      <div class="co-section">
        <h3>배송지</h3>
        <div class="co-grid">
          <div class="field full"><label>주소</label><input name="addr" placeholder="도로명 주소" required><div class="err">주소를 입력해 주세요.</div></div>
          <div class="field full"><label>상세 주소</label><input name="addr2" placeholder="상세 주소 (동/호수)"></div>
          <div class="field full"><label>배송 메모</label><textarea name="memo" rows="2" placeholder="예: 부재 시 경비실에 맡겨주세요"></textarea></div>
        </div>
      </div>
      <div class="co-section">
        <h3>결제 수단</h3>
        <div class="pay-disabled">💳 결제 기능은 데모 버전에서 비활성화되어 있습니다.<br>주문서 제출 시 <b>주문 접수</b>까지만 진행됩니다.</div>
      </div>
    </div>

    <div>
      <div class="summary">
        <h3>주문 상품</h3>
        <div id="coItems" style="margin-bottom:14px"></div>
        <div class="row"><span>상품 합계</span><span>${won(total)}</span></div>
        <div class="row"><span>배송비</span><span>${ship? won(ship):'무료'}</span></div>
        <div class="row total"><span>총 결제 예정</span><b>${won(total+ship)}</b></div>
        <button class="btn green block" type="submit" style="margin-top:18px">주문 접수하기</button>
        <p class="note">※ 데모 사이트로 실제 결제·청구가 발생하지 않습니다.</p>
      </div>
    </div>
  </form>`;

  document.getElementById('coItems').innerHTML = items.map(i=>{ const p=byId(i.id);
    return `<div style="display:flex;justify-content:space-between;font-size:.86rem;padding:5px 0;color:var(--ink-soft)">
      <span>${p.brand} ${p.name} <b style="color:var(--stone)">×${i.qty}</b></span><span>${won(p.price*i.qty)}</span></div>`; }).join('');

  document.getElementById('coForm').addEventListener('submit', e=>{
    e.preventDefault();
    if(!window.LUIO.Auth.current()){ window.LUIO.openAuth('login'); window.LUIO.toast('로그인 후 주문할 수 있습니다.'); return; }
    const f = e.target; let ok = true;
    ['name','phone','email','addr'].forEach(n=>{
      const inp = f[n]; const bad = !inp.value.trim() || (n==='email' && !/^\S+@\S+\.\S+$/.test(inp.value));
      inp.closest('.field').classList.toggle('invalid', bad); if(bad) ok=false;
    });
    if(!ok) return;
    const order = window.LUIO.Orders.place({
      name:f.name.value, phone:f.phone.value, email:f.email.value,
      addr:f.addr.value + ' ' + f.addr2.value, memo:f.memo.value
    });
    window.LUIO.sync();
    location.href = 'complete.html?no=' + order.no;
  });
});
</script>
</body>
</html>
